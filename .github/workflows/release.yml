name: Release EtherDrop Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: etherdrop-mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Test updater and release versioning
        run: |
          npm test
          python -m unittest discover -s tests -p test_release.py -v
          python -m unittest discover -s tests -p test_updater_download.py -v
      - name: Prepare version and release notes
        id: prepare
        run: python scripts/prepare_release.py
      - name: Generate README download QR
        run: |
          python -m pip install -r scripts/qr-requirements.txt
          python scripts/generate_download_qr.py
      - name: Generate Android project
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build and sign standalone Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/etherdrop-release.jks
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo 'Configure the four Android signing secrets before publishing a release.'
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cat scripts/release-signing.gradle >> android/app/build.gradle
          chmod +x android/gradlew
          android/gradlew -p android :app:assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/EtherDrop.apk
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/etherdrop-release.jks"
      - name: Commit, tag, and sync main
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json RELEASE_NOTES.md src/release-notes.json assets/download-qr.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$RELEASE_VERSION"
          fi
          git tag "v$RELEASE_VERSION"
          git fetch origin main
          git switch -C main origin/main
          git merge --no-edit release
          git switch release
          git push --atomic origin release main "v$RELEASE_VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cp RELEASE_NOTES.md dist/release-notes.md
          cat >> dist/release-notes.md <<'EOF'

          ## Download on Android

          Scan or click the QR code to download the latest EtherDrop APK.

          [![Download EtherDrop APK](https://raw.githubusercontent.com/JaafarTanoukhi/EtherDrop-Mobile/main/assets/download-qr.png)](https://github.com/JaafarTanoukhi/EtherDrop-Mobile/releases/latest/download/EtherDrop.apk)
          EOF
          gh release create "v$RELEASE_VERSION" dist/EtherDrop.apk --verify-tag --title "EtherDrop Mobile v$RELEASE_VERSION" --notes-file dist/release-notes.md --latest
